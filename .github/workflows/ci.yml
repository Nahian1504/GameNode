name: GameNode CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:

  # =========================
  # Backend Tests
  # =========================
  backend-test:
    name: Run Backend Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js 18
        uses: actions/setup-node@v4.4.0
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: ./server
        run: npm ci

      # ✅ Ensure MongoDB is ready
      - name: Wait for MongoDB
        run: |
          for i in {1..10}; do
            nc -z localhost 27017 && echo "MongoDB is ready" && exit 0
            echo "Waiting for MongoDB..."
            sleep 3
          done
          echo "MongoDB failed to start"
          exit 1

      - name: Run backend tests
        working-directory: ./server
        env:
          NODE_ENV: test
          MONGODB_URI_TEST: mongodb://localhost:27017/test
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: npm test -- --passWithNoTests --detectOpenHandles

      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: backend-test-results
          path: |
            server/tests/
            server/test-results/
          retention-days: 7

  # =========================
  # Frontend Tests
  # =========================
  frontend-test:
    name: Run Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js 18
        uses: actions/setup-node@v4.4.0
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: ./client
        run: npm ci

      - name: Run frontend tests
        working-directory: ./client
        env:
          CI: true
        run: npm test -- --watchAll=false --passWithNoTests

      - name: Upload frontend test results
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: frontend-test-results
          path: |
            client/src/tests/
            client/test-results/
          retention-days: 7

  # =========================
  # Final Status Check
  # =========================
  ci-success:
    name: All Tests Passed
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: ${{ always() }}

    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ needs.backend-test.result }}" != "success" ]; then
            echo "❌ Backend tests failed"
            exit 1
          fi
          if [ "${{ needs.frontend-test.result }}" != "success" ]; then
            echo "❌ Frontend tests failed"
            exit 1
          fi
          echo "✅ All tests passed"
